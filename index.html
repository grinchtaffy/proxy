<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin">
<title>LiveChat Browser</title><link rel="preconnect" href="https://livechat-ai.codingboy-ca.workers.dev"><link rel="preconnect" href="https://www.gstatic.com" crossorigin><link rel="icon" href="https://grinchtaffy.github.io/livechat/livechat-icon-192.png">
<style>
:root{color-scheme:light;--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#52627a;--line:#d7e1ee;--accent:#2563eb}html.dark{color-scheme:dark;--bg:#10151e;--card:#1a2433;--text:#f0f5fb;--muted:#adbed2;--line:#39465a;--accent:#4a8bff}*{box-sizing:border-box}html,body{margin:0;height:100%;font:14px system-ui,sans-serif;background:var(--bg);color:var(--text)}body{display:flex;flex-direction:column;overflow:hidden}header{display:flex;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid var(--line);background:var(--card);flex:0 0 auto}header img{width:24px;height:24px;border-radius:6px}header strong{font-size:14px}header .who{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}header .spacer{flex:1}header a{color:var(--accent);text-decoration:none;font-weight:600;white-space:nowrap}main{position:relative;flex:1;min-height:0;display:grid;place-items:center}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}[hidden]{display:none!important}section{max-width:440px;margin:20px;padding:26px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 30px #0001}h1{margin:0 0 12px;font-size:24px}p{color:var(--muted);line-height:1.5}button,.btn{display:inline-block;border:0;background:var(--accent);color:white;padding:10px 16px;border-radius:8px;text-decoration:none;font:600 14px system-ui;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.secondary{background:transparent;color:var(--accent);border:1px solid var(--line)}.actions{display:flex;gap:8px;flex-wrap:wrap}#error{font-weight:600}body:has(iframe:not([hidden])) section{position:absolute;z-index:2}
header .quick{background:transparent;color:var(--text);border:1px solid var(--line);padding:5px 9px;white-space:nowrap;font-size:12px}header .quick:hover{border-color:var(--accent);color:var(--accent)}header .quick:focus-visible,header a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}header .quick kbd{font:10px system-ui;color:var(--muted);margin-left:5px}header .who:empty{display:none}@media(max-width:540px){header{gap:7px;padding:6px 8px}header strong{font-size:12px}header .who,header .quick kbd{display:none}header a{font-size:12px}}@media(prefers-reduced-motion:no-preference){#panel{animation:lc-appear .18s ease-out}@keyframes lc-appear{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}}
</style>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-auth-compat.js"></script>
</head>
<body>
<header><img src="https://grinchtaffy.github.io/livechat/livechat-icon-192.png" alt=""><strong>LiveChat Browser</strong><span id="who" class="who"></span><span class="spacer"></span><button id="quick" class="quick" type="button" title="Search tabs, bookmarks and actions" hidden>Quick actions <kbd>Ctrl ⇧ K</kbd></button><a href="https://grinchtaffy.github.io/livechat/" target="_self">← LiveChat</a></header>
<main id="stage"><section id="panel" role="status"><h1 id="heading">Connecting to LiveChat…</h1><p id="error">Checking your saved login and browser permissions.</p><div class="actions"><button id="retry" hidden>Try again</button><a id="signin" class="btn" href="https://grinchtaffy.github.io/livechat/?lcBrowserReturn=1" hidden>Log in / create account</a><a id="back" class="btn secondary" href="https://grinchtaffy.github.io/livechat/" hidden>Back to LiveChat</a></div></section></main>
<script>
(()=>{'use strict';
const API='https://livechat-ai.codingboy-ca.workers.dev', ORIGIN=new URL(API).origin;
const config={apiKey:'AIzaSyBjQ4F-UhswfcW634XUcNqDf3DE0a8O68I',authDomain:'chatapp-b0c63.firebaseapp.com',databaseURL:'https://chatapp-b0c63-default-rtdb.firebaseio.com',projectId:'chatapp-b0c63',storageBucket:'chatapp-b0c63.firebasestorage.app',messagingSenderId:'920353833960',appId:'1:920353833960:web:051f63d23a96b8985f1a5d'};
const $=id=>document.getElementById(id), stage=$('stage');let auth,frame=null,epoch=0,timer=null,busy=false,preferences={},lastUid=null,device,loadTimer=null,lastSentPrefs=null;
function apply(p,force=false){preferences=p||{};document.documentElement.classList.toggle('dark',preferences.darkMode===true);const key=JSON.stringify(preferences);if(frame&&(force||lastSentPrefs!==key)){frame.contentWindow?.postMessage({type:'lc-browser-prefs',prefs:preferences},ORIGIN);lastSentPrefs=key;}}
try{document.documentElement.classList.toggle('dark',localStorage.getItem('chatapp.theme')==='dark');device=localStorage.getItem('chatapp.deviceId.v1');if(!device){device=crypto.randomUUID();localStorage.setItem('chatapp.deviceId.v1',device);}if(localStorage.getItem('chatapp.deviceId.v1')!==device||!/^[A-Za-z0-9_-]{12,100}$/.test(device))throw Error('Browser storage is disabled.');}catch(e){show('Storage required','Enable site storage and reload.');return;}
function removeFrame(){clearTimeout(loadTimer);lastSentPrefs=null;$('quick').hidden=true;if(frame){frame.remove();frame=null;}$('who').textContent='';}
function show(title,message,opts={}){removeFrame();$('panel').hidden=false;$('heading').textContent=title;$('error').textContent=message;$('retry').hidden=!opts.retry;$('signin').hidden=!opts.signin;$('back').hidden=false;}
function stop(){clearInterval(timer);timer=null;epoch++;busy=false;removeFrame();}
async function request(user,action){const token=await user.getIdToken();const r=await fetch(API+'/livechat-browser/'+action,{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({device}),cache:'no-store',credentials:'omit'});const d=await r.json().catch(()=>({error:'Browser service could not respond.'}));if(!r.ok){const e=Error(d.error||'Access check failed.');e.status=r.status;e.setup=d.setup;e.banned=d.banned;throw e;}return d;}
function fail(e){if(e.setup){location.replace('https://grinchtaffy.github.io/livechat/?lcBrowserReturn=1');return;}if(e.status===401){show('Sign in required',e.message,{signin:true});return;}show(e.status===403?'Browser access unavailable':'Connection problem',e.message,{retry:true});}
function launch(ticket){removeFrame();const el=document.createElement('iframe');el.name='lc-browser-frame';el.title='LiveChat Browser';el.referrerPolicy='strict-origin';el.setAttribute('sandbox','allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads allow-pointer-lock');el.setAttribute('allow','fullscreen; autoplay; clipboard-read; clipboard-write; gamepad; camera; microphone');el.allowFullscreen=true;frame=el;stage.prepend(el);
 const form=document.createElement('form');form.method='POST';form.action=API+'/livechat-browser/render';form.target=el.name;form.hidden=true;const input=document.createElement('input');input.name='ticket';input.value=ticket;form.append(input);document.body.append(form);form.submit();form.remove();
 loadTimer=setTimeout(()=>{if(frame===el){show('Browser did not load','The launch could not be verified. Try again.',{retry:true});}},45000);
}
window.addEventListener('message',e=>{if(e.origin!==ORIGIN||e.source!==frame?.contentWindow||e.data?.type!=='lc-browser-ready')return;clearTimeout(loadTimer);$('panel').hidden=true;apply(preferences,true);});
window.addEventListener('message',e=>{if(e.origin===ORIGIN&&e.source===frame?.contentWindow&&e.data?.type==='lc-browser-quick-ready')$('quick').hidden=false;});
$('quick').onclick=()=>{if(frame&&!$('quick').hidden)frame.contentWindow?.postMessage({type:'lc-browser-quick-actions'},ORIGIN);};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.shiftKey&&!e.altKey&&e.key.toLowerCase()==='k'&&!$('quick').hidden){e.preventDefault();$('quick').click();}});
async function check(user,open=false){if(busy||!user)return;busy=true;const version=epoch;try{const d=await request(user,open?'launch':'status');if(version!==epoch||auth.currentUser?.uid!==user.uid)return;apply(d.prefs);$('who').textContent='Signed in as '+d.username;if(open){if(!d.ticket)throw Error('No browser launch ticket.');launch(d.ticket);$('who').textContent='Signed in as '+d.username;} }catch(e){if(version===epoch)fail(e);}finally{if(version===epoch)busy=false;}}
function begin(user){stop();if(!user){lastUid=null;location.replace('https://grinchtaffy.github.io/livechat/?lcBrowserReturn=1');return;}lastUid=user.uid;try{const cached=JSON.parse(localStorage.getItem('chatapp.cachedPrefs.'+user.uid)||'{}');apply(cached);}catch{}$('panel').hidden=false;$('heading').textContent='Connecting to LiveChat…';$('error').textContent='Checking your browser permissions.';$('retry').hidden=true;$('signin').hidden=true;$('back').hidden=true;check(user,true);timer=setInterval(()=>{if(auth.currentUser?.uid===user.uid&&frame)check(user);},60000);}
$('retry').onclick=()=>{if(auth?.currentUser)begin(auth.currentUser);else location.replace('https://grinchtaffy.github.io/livechat/?lcBrowserReturn=1');};
window.addEventListener('storage',e=>{if(e.key==='chatapp.deviceId.v1'&&e.newValue!==device){stop();show('Installation changed','Reload to verify this installation.',{retry:false});}if(lastUid&&e.key==='chatapp.cachedPrefs.'+lastUid){try{apply(JSON.parse(e.newValue||'{}'));}catch{}}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&auth?.currentUser&&frame)check(auth.currentUser);});
try{firebase.initializeApp(config);auth=firebase.auth();auth.onAuthStateChanged(begin,e=>show('Sign-in unavailable',e.message,{retry:true,signin:true}));}catch(e){show('LiveChat could not connect','Check your connection and reload.',{signin:true});}
})();
</script>
