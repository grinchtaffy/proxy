<style>
:root{color-scheme:light;--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#52627a;--line:#d7e1ee;--accent:#2563eb}html.dark{color-scheme:dark;--bg:#10151e;--card:#1a2433;--text:#f0f5fb;--muted:#adbed2;--line:#39465a;--accent:#4a8bff}*{box-sizing:border-box}html,body{margin:0;height:100%;font:14px system-ui,sans-serif;background:var(--bg);color:var(--text)}body{display:flex;flex-direction:column;overflow:hidden}header{display:flex;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid var(--line);background:var(--card);flex:0 0 auto}header img{width:24px;height:24px;border-radius:6px}header strong{font-size:14px}header .who{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}header .spacer{flex:1}header a{color:var(--accent);text-decoration:none;font-weight:600;white-space:nowrap}main{position:relative;flex:1;min-height:0;display:grid;place-items:center}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}[hidden]{display:none!important}section{max-width:440px;margin:20px;padding:26px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 30px #0001}h1{margin:0 0 12px;font-size:24px}p{color:var(--muted);line-height:1.5}button,.btn{display:inline-block;border:0;background:var(--accent);color:white;padding:10px 16px;border-radius:8px;text-decoration:none;font:600 14px system-ui;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.secondary{background:transparent;color:var(--accent);border:1px solid var(--line)}.actions{display:flex;gap:8px;flex-wrap:wrap}#error{font-weight:600}body:has(iframe:not([hidden])) section{position:absolute;z-index:2}
header .quick{background:transparent;color:var(--text);border:1px solid var(--line);padding:5px 9px;white-space:nowrap;font-size:12px}header .quick:hover{border-color:var(--accent);color:var(--accent)}header .quick:focus-visible,header a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}header .quick kbd{font:10px system-ui;color:var(--muted);margin-left:5px}header .who:empty{display:none}@media(max-width:540px){header{gap:7px;padding:6px 8px}header strong{font-size:12px}header .who,header .quick kbd{display:none}header a{font-size:12px}}@media(prefers-reduced-motion:no-preference){#panel{animation:lc-appear .18s ease-out}@keyframes lc-appear{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}}

<script src="https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js"></script>

<body>
<header><img src="https://grinchtaffy.github.io/livechat/livechat-icon-192.png" alt=""><strong>LiveChat Browser</strong><span id="who" class="who"></span><span class="spacer"></span><button id="quick" class="quick" type="button" title="Search tabs, bookmarks and actions" hidden>Quick actions <kbd>Ctrl ⇧ K</kbd></button><a href="https://grinchtaffy.github.io/livechat/" target="_self">← LiveChat</a></header>
<main id="stage"><section id="panel" role="status"><h1 id="heading">Connecting to LiveChat…</h1><p id="error">Checking your saved login and browser permissions.</p><div class="actions"><button id="retry" hidden>Try again</button><a id="signin" class="btn" href="https://grinchtaffy.github.io/livechat/?lcBrowserReturn=1" hidden>Log in / create account</a><a id="back" class="btn secondary" href="https://grinchtaffy.github.io/livechat/" hidden>Back to LiveChat</a></div></section></main>
<script>
(()=>{'use strict';
const API='https://livechat-ai.codingboy-ca.workers.dev', ORIGIN=new URL(API).origin;
const config={apiKey:'AIzaSyBjQ4F-UhswfcW634XUcNqDf3DE0a8O68I',authDomain:'chatapp-b0c63.firebaseapp.com',databaseURL:'https://chatapp-b0c63-default-rtdb.firebaseio.com',projectId:'chatapp-b0c63',storageBucket:'chatapp-b0c63.firebasestorage.app',messagingSenderId:'920353833960',appId:'1:920353833960:web:051f63d23a96b8985f1a5d'};
const $=id=>document.getElementById(id), stage=$('stage');
const LOGIN='https://grinchtaffy.github.io/livechat/?lcBrowserReturn=1', RETURN_KEY='lc.browser.loginAttempt.v3';
const returned=new URLSearchParams(location.search).get('lcReturned')==='1';
function attempted(){try{return !!sessionStorage.getItem(RETURN_KEY);}catch(e){return false;}}
function markAttempt(){try{sessionStorage.setItem(RETURN_KEY,'1');}catch(e){}}
function clearAttempt(){try{sessionStorage.removeItem(RETURN_KEY);}catch(e){}}
function goLogin(){markAttempt();location.replace(LOGIN);}
function newDevice(){if(typeof crypto.randomUUID==='function')return crypto.randomUUID();const b=new Uint8Array(16);crypto.getRandomValues(b);return Array.from(b,x=>('0'+x.toString(16)).slice(-2)).join('');}
let auth,frame=null,epoch=0,timer=null,busy=false,preferences={},lastUid=null,device,loadTimer=null,lastSentPrefs=null;
function apply(p,force=false){preferences=p||{};document.documentElement.classList.toggle('dark',preferences.darkMode===true);const key=JSON.stringify(preferences);if(frame&&(force||lastSentPrefs!==key)){frame.contentWindow?.postMessage({type:'lc-browser-prefs',prefs:preferences},ORIGIN);lastSentPrefs=key;}}
try{document.documentElement.classList.toggle('dark',localStorage.getItem('chatapp.theme')==='dark');device=localStorage.getItem('chatapp.deviceId.v1');if(!device){device=newDevice();localStorage.setItem('chatapp.deviceId.v1',device);}if(localStorage.getItem('chatapp.deviceId.v1')!==device||!/^[A-Za-z0-9_-]{12,100}$/.test(device))throw Error('Browser storage is disabled.');}catch(e){show('Storage required','Enable site storage and reload.');return;}
function removeFrame(){clearTimeout(loadTimer);lastSentPrefs=null;$('quick').hidden=true;if(frame){frame.remove();frame=null;}$('who').textContent='';}
function show(title,message,opts={}){removeFrame();$('panel').hidden=false;$('heading').textContent=title;$('error').textContent=message;$('retry').hidden=!opts.retry;$('signin').hidden=!opts.signin;$('back').hidden=false;}
function stop(){clearInterval(timer);timer=null;epoch++;busy=false;removeFrame();}
function failure(message,code,status){const e=Error(message);e.code=code;e.status=status;return e;}
const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function timedFetch(url,opts){let t;const controller=typeof AbortController==='function'?new AbortController():null;try{return await Promise.race([fetch(url,controller?Object.assign({},opts,{signal:controller.signal}):opts),new Promise((_,reject)=>{t=setTimeout(()=>{reject(failure('The browser service did not respond in time.','LC-NET-TIMEOUT'));if(controller)controller.abort();},12000);})]);}finally{clearTimeout(t);}}
async function request(user,action,version){let refreshed=false;for(let n=0;n<3;n++){
 if(version!==epoch||!auth.currentUser||auth.currentUser.uid!==user.uid)throw failure('Account changed.','LC-AUTH-CHANGED');
 try{
 let token;try{token=await user.getIdToken(refreshed);}catch(e){if(e.code==='auth/user-token-expired'||e.code==='auth/invalid-user-token'||e.code==='auth/user-disabled')throw failure('Your LiveChat session is no longer valid.','LC-AUTH-401',401);throw failure('Could not refresh the saved LiveChat login. Check the connection to Firebase.','LC-AUTH-NET');}
 let r;try{r=await timedFetch(API+'/livechat-browser/'+action,{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({device}),cache:'no-store',credentials:'omit'});}catch(e){throw e.code?e:failure('Could not reach the LiveChat Browser service. Check your connection and whether Silk allows this site.','LC-NET-FETCH');}
 const d=await r.json().catch(()=>({error:'Browser service returned an unreadable response.'}));
 if(r.status===401&&!refreshed&&n<2){refreshed=true;continue;}
 if(!r.ok){const e=failure(d.error||'Access check failed.','LC-HTTP-'+r.status,r.status);e.setup=d.setup;e.banned=d.banned;throw e;}
 if(d.allowed!==true)throw failure('Browser service returned an unexpected response.','LC-RESPONSE');return d;
 }catch(e){const retryable=!e.status||e.status===429||e.status>=500;if(n===2||!retryable)throw e;await delay(600*(n+1));}
 }throw failure('Could not verify browser access.','LC-RESPONSE');}
function fail(e){const code=e.code||'LC-UNKNOWN';const message=(e.message||'Browser access could not be verified.')+' ('+code+')';if(e.setup){show('Account setup could not be verified',message+' Return to LiveChat to check your account, or ask an admin. No automatic redirects.',{retry:true,signin:true});return;}if(e.status===401){show('Sign in required',message,{retry:true,signin:true});return;}show(e.status===403?'Browser access unavailable':'Connection problem',message,{retry:true});}
function launch(ticket){removeFrame();const el=document.createElement('iframe');el.name='lc-browser-frame';el.title='LiveChat Browser';el.referrerPolicy='strict-origin';el.setAttribute('sandbox','allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads allow-pointer-lock');el.setAttribute('allow','fullscreen; autoplay; clipboard-read; clipboard-write; gamepad; camera; microphone');el.allowFullscreen=true;frame=el;stage.prepend(el);
 const form=document.createElement('form');form.method='POST';form.action=API+'/livechat-browser/render';form.target=el.name;form.hidden=true;const input=document.createElement('input');input.name='ticket';input.value=ticket;form.append(input);document.body.append(form);form.submit();form.remove();
 loadTimer=setTimeout(()=>{if(frame===el){show('Browser did not load','The browser launch did not finish. Check that Silk permits the embedded browser, then try again. (LC-RENDER-TIMEOUT)',{retry:true});}},45000);
}
window.addEventListener('message',e=>{if(e.origin!==ORIGIN||e.source!==frame?.contentWindow||e.data?.type!=='lc-browser-ready')return;clearTimeout(loadTimer);$('panel').hidden=true;clearAttempt();apply(preferences,true);});
window.addEventListener('message',e=>{if(e.origin===ORIGIN&&e.source===frame?.contentWindow&&e.data?.type==='lc-browser-quick-ready')$('quick').hidden=false;});
$('quick').onclick=()=>{if(frame&&!$('quick').hidden)frame.contentWindow?.postMessage({type:'lc-browser-quick-actions'},ORIGIN);};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.shiftKey&&!e.altKey&&e.key.toLowerCase()==='k'&&!$('quick').hidden){e.preventDefault();$('quick').click();}});
async function check(user,open=false){if(busy||!user)return;busy=true;const version=epoch;try{const d=await request(user,open?'launch':'status',version);if(version!==epoch||auth.currentUser?.uid!==user.uid)return;apply(d.prefs);$('who').textContent='Signed in as '+d.username;if(open){if(!d.ticket)throw Error('No browser launch ticket.');launch(d.ticket);$('who').textContent='Signed in as '+d.username;} }catch(e){if(version===epoch)fail(e);}finally{if(version===epoch)busy=false;}}
function begin(user){stop();if(!user){lastUid=null;if(!returned&&!attempted()){goLogin();return;}show('Sign in required','The browser could not recover your saved LiveChat login. Sign in again or retry. (LC-AUTH-NOSESSION)',{retry:true,signin:true});return;}lastUid=user.uid;try{const cached=JSON.parse(localStorage.getItem('chatapp.cachedPrefs.'+user.uid)||'{}');apply(cached);}catch{}$('panel').hidden=false;$('heading').textContent='Connecting to LiveChat…';$('error').textContent='Checking your browser permissions.';$('retry').hidden=true;$('signin').hidden=true;$('back').hidden=true;check(user,true);timer=setInterval(()=>{if(auth.currentUser?.uid===user.uid&&frame)check(user);},60000);}
$('retry').onclick=()=>{if(auth&&auth.currentUser)begin(auth.currentUser);else location.reload();};
$('signin').addEventListener('click',markAttempt);
window.addEventListener('storage',e=>{if(e.key==='chatapp.deviceId.v1'&&e.newValue!==device){stop();show('Installation changed','Reload to verify this installation.',{retry:false});}if(lastUid&&e.key==='chatapp.cachedPrefs.'+lastUid){try{apply(JSON.parse(e.newValue||'{}'));}catch{}}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&auth?.currentUser&&frame)check(auth.currentUser);});
let authTimer=setTimeout(()=>show('Sign-in taking longer than expected','Could not restore the saved login. Check the connection to Firebase and retry. (LC-AUTH-TIMEOUT)',{retry:true,signin:true}),15000);
try{firebase.initializeApp(config);auth=firebase.auth();auth.onAuthStateChanged(user=>{clearTimeout(authTimer);begin(user);},e=>{clearTimeout(authTimer);show('Sign-in unavailable','Could not restore your LiveChat login. (LC-AUTH-SDK)',{retry:true,signin:true});});}catch(e){clearTimeout(authTimer);show('LiveChat could not connect','Check your connection to Firebase and reload. (LC-AUTH-SDK)',{retry:true,signin:true});}
})();
</script>
