<body>
<header><img src="https://grinchtaffy.github.io/livechat/livechat-icon-192.png" alt=""><strong>LiveChat Browser</strong><span id="who" class="who"></span><span class="spacer"></span><button id="quick" class="quick" type="button" title="Search tabs, bookmarks and actions" hidden>Quick actions <kbd>Ctrl ⇧ K</kbd></button><a href="https://grinchtaffy.github.io/livechat/" target="_self">← LiveChat</a></header>

<script>
(()=>{'use strict';
const API='https://livechat-ai.codingboy-ca.workers.dev', ORIGIN=new URL(API).origin;
const config={apiKey:'AIzaSyBjQ4F-UhswfcW634XUcNqDf3DE0a8O68I',authDomain:'chatapp-b0c63.firebaseapp.com',databaseURL:'https://chatapp-b0c63-default-rtdb.firebaseio.com',projectId:'chatapp-b0c63',storageBucket:'chatapp-b0c63.firebasestorage.app',messagingSenderId:'920353833960',appId:'1:920353833960:web:051f63d23a96b8985f1a5d'};

const LOGIN='https://grinchtaffy.github.io/livechat/?lcBrowserReturn=1', RETURN_KEY='lc.browser.loginAttempt.v3';

function newDevice(){if(typeof crypto.randomUUID==='function')return crypto.randomUUID();const b=new Uint8Array(16);crypto.getRandomValues(b);return Array.from(b,x=>('0'+x.toString(16)).slice(-2)).join('');}
let auth,requestDb,requestDbLoading=null,requestRef=null,requestCb=null,frame=null,epoch=0,timer=null,busy=false,preferences={},lastUid=null,device,loadTimer=null,lastSentPrefs=null;
function apply(p,force=false){preferences=p||{};document.documentElement.classList.toggle('dark',preferences.darkMode===true);const key=JSON.stringify(preferences);if(frame&&(force||lastSentPrefs!==key)){frame.contentWindow?.postMessage({type:'lc-browser-prefs',prefs:preferences},ORIGIN);lastSentPrefs=key;}}

async function watchAccessRequest(user){
 clearRequestWatch();if(!user||auth.currentUser?.uid!==user.uid)return;
 const initialEpoch=epoch;$('accessRequest').hidden=false;$('requestStatus').textContent='Checking request status…';
 try{if(!requestDb){if(!requestDbLoading)requestDbLoading=loadSdk('https://www.gstatic.com/firebasejs/12.15.0/firebase-database-compat.js').then(()=>requestDb=firebase.database()).catch(e=>{requestDbLoading=null;throw e;});await requestDbLoading;}}catch(e){if(initialEpoch===epoch&&auth.currentUser?.uid===user.uid)$('requestStatus').textContent='Could not connect to the request service. Try again.';return;}

 const uid=user.uid,version=epoch,ref=requestDb.ref('livechatBrowser/requests/'+uid);requestRef=ref;
 const button=$('sendRequest'),status=$('requestStatus'),err=$('requestError');$('accessRequest').hidden=false;
 let previous=null;const valid=()=>requestRef===ref&&version===epoch&&auth.currentUser?.uid===uid;
 status.textContent='Checking request status…';
 button.onclick=async()=>{if(!valid()||button.disabled)return;button.disabled=true;err.textContent='';try{await deadline(ref.set({status:'pending',createdAt:firebase.database.ServerValue.TIMESTAMP}),12000,'Request submission timed out. Please check the status before retrying.','LC-REQUEST-TIMEOUT');}catch(e){if(valid())err.textContent='Could not submit request. If you already sent one, its status will appear here. '+(e.message||'');}finally{if(valid())button.disabled=false;}};

  if(next==='pending')status.textContent='Request sent. Waiting for an admin to review it.';
  else if(next==='read')status.textContent='An admin has read your request. Waiting for a decision.';
  else if(next==='denied')status.textContent='Your access request was denied. You can still use regular LiveChat.';
  else if(next==='approved'){status.textContent='Your request was approved. Checking your current browser access…';if(previous==='pending'||previous==='read'){previous=next;begin(user);return;}status.textContent='Your previous request was approved, but browser access is not currently available. Try again or contact an admin.';}
  else status.textContent='Ask an admin for access to LiveChat Browser.';
  previous=next;
 };
 ref.on('value',requestCb,e=>{if(valid()){button.hidden=true;status.textContent='Could not read request status. Try again later.';err.textContent=e.message||'';}});
}
function show(title,message,opts={}){clearRequestWatch();removeFrame();$('panel').hidden=false;$('heading').textContent=title;$('error').textContent=message;$('retry').hidden=!opts.retry;$('signin').hidden=!opts.signin;$('back').hidden=false;}
function stop(){clearRequestWatch();clearInterval(timer);timer=null;epoch++;busy=false;removeFrame();}
function failure(message,code,status){const e=Error(message);e.code=code;e.status=status;return e;}
const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function deadline(promise,ms,message,code){let t;return Promise.race([promise,new Promise((_,reject)=>{t=setTimeout(()=>reject(failure(message,code)),ms);})]).finally(()=>clearTimeout(t));}
function loadSdk(src){return new Promise((resolve,reject)=>{const script=document.createElement('script');let t;const finish=(err)=>{clearTimeout(t);script.onload=script.onerror=null;if(err){script.remove();reject(err);}else resolve();};script.onload=()=>finish();script.onerror=()=>finish(failure('The Firebase sign-in service could not be loaded.','LC-AUTH-SDK'));t=setTimeout(()=>finish(failure('The Firebase sign-in service did not load in time.','LC-AUTH-SDK-TIMEOUT')),10000);script.src=src;document.head.append(script);});}
async function timedFetch(url,opts){let t;const controller=typeof AbortController==='function'?new AbortController():null;try{return await Promise.race([fetch(url,controller?Object.assign({},opts,{signal:controller.signal}):opts),new Promise((_,reject)=>{t=setTimeout(()=>{reject(failure('The browser service did not respond in time.','LC-NET-TIMEOUT'));if(controller)controller.abort();},12000);})]);}finally{clearTimeout(t);}}
async function request(user,action,version){let refreshed=false;for(let n=0;n<3;n++){
 if(version!==epoch||!auth.currentUser||auth.currentUser.uid!==user.uid)throw failure('Account changed.','LC-AUTH-CHANGED');
 try{
 let token;try{token=await deadline(user.getIdToken(refreshed),10000,'Saved sign-in verification timed out.','LC-AUTH-TIMEOUT');}catch(e){if(e.code==='auth/user-token-expired'||e.code==='auth/invalid-user-token'||e.code==='auth/user-disabled')throw failure('Your LiveChat session is no longer valid.','LC-AUTH-401',401);throw failure('Could not refresh the saved LiveChat login. Check the connection to Firebase.',e.code==='LC-AUTH-TIMEOUT'?'LC-AUTH-TIMEOUT':'LC-AUTH-NET');}
 let r;try{r=await timedFetch(API+'/livechat-browser/'+action,{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({device}),cache:'no-store',credentials:'omit'});}catch(e){throw typeof e.code==='string'?e:failure('Could not reach the LiveChat Browser service. Check your connection and network access.','LC-NET-FETCH');}
 const contentType=r.headers.get('content-type')||'';
 if(!/\bjson\b/i.test(contentType)){throw failure('The browser service did not return its normal response. The network may be blocking access.','LC-NET-RESPONSE',r.status||502);}
 const d=await deadline(r.json(),5000,'The browser service response timed out.','LC-NET-TIMEOUT').catch(e=>{throw e.code?e:failure('The browser service returned an invalid response.','LC-NET-RESPONSE',r.status||502);});
 if(r.status===401&&!refreshed&&n<2){refreshed=true;continue;}
 if(!r.ok){const e=failure(d.error||'Access check failed.','LC-HTTP-'+r.status,r.status);e.setup=d.setup;e.banned=d.banned;e.approvalRequired=r.status===403&&!d.banned&&!d.setup&&d.error==='LiveChat Browser requires approval from an admin.';throw e;}
 if(d.allowed!==true)throw failure('Browser service returned an unexpected response.','LC-RESPONSE');return d;
 }catch(e){const retryable=!e.status||e.status===429||e.status>=500;if(n===2||!retryable||e.code==='LC-NET-RESPONSE'||e.code==='LC-AUTH-CHANGED')throw e;await delay(600*(n+1));}
 }throw failure('Could not verify browser access.','LC-RESPONSE');}
function fail(e){if(e.approvalRequired){show('Approval required','Your LiveChat account is signed in, but needs an admin’s approval to use this browser.',{retry:true});watchAccessRequest(auth.currentUser);return;}const code=typeof e.code==='string'?e.code:'LC-UNKNOWN';const message=(e.message||'Browser access could not be verified.')+' ('+code+')';if(code.startsWith('LC-NET-')){show('Browser service unavailable','LiveChat Browser cannot reach or verify its required service. Your network may be blocking it. If access is restricted, ask the network administrator to approve the service. ('+code+')',{retry:true});return;}if(e.setup){show('Account setup could not be verified',message+' Return to LiveChat to check your account, or ask an admin. No automatic redirects.',{retry:true,signin:true});return;}if(e.status===401){show('Sign in required',message,{retry:true,signin:true});return;}show(e.status===403?'Browser access unavailable':'Connection problem',message,{retry:true});}
function launch(ticket){removeFrame();const el=document.createElement('iframe');el.name='lc-browser-frame';el.title='LiveChat Browser';el.referrerPolicy='strict-origin';el.setAttribute('sandbox','allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads allow-pointer-lock');el.setAttribute('allow','fullscreen; autoplay; clipboard-read; clipboard-write; gamepad; camera; microphone');el.allowFullscreen=true;el.setAttribute('data-pending','');el.setAttribute('aria-hidden','true');frame=el;stage.prepend(el);$('heading').textContent='Opening LiveChat Browser…';$('error').textContent='Waiting for the authorized browser to finish loading.';$('back').hidden=false;

}

async function check(user,open=false){if(busy||!user)return;busy=true;const version=epoch;try{const d=await deadline(request(user,open?'launch':'status',version),25000,'The browser service did not finish verifying access.','LC-NET-TIMEOUT');if(version!==epoch||auth.currentUser?.uid!==user.uid)return;apply(d.prefs);$('who').textContent='Signed in as '+d.username;if(open){if(!d.ticket)throw Error('No browser launch ticket.');launch(d.ticket);$('who').textContent='Signed in as '+d.username;} }catch(e){if(version===epoch){stop();fail(e);}}finally{if(version===epoch)busy=false;}}

(async()=>{let authTimer;try{await loadSdk('https://www.gstatic.com/firebasejs/12.15.0/firebase-app-compat.js');await loadSdk('https://www.gstatic.com/firebasejs/12.15.0/firebase-auth-compat.js');firebase.initializeApp(config);auth=firebase.auth();authTimer=setTimeout(()=>show('Sign-in taking longer than expected','Could not restore the saved login. Check the connection to Firebase and retry. (LC-AUTH-TIMEOUT)',{retry:true,signin:true}),15000);auth.onAuthStateChanged(user=>{clearTimeout(authTimer);begin(user);},e=>{clearTimeout(authTimer);stop();show('Sign-in unavailable','Could not restore your LiveChat login. (LC-AUTH-SDK)',{retry:true,signin:true});});}catch(e){clearTimeout(authTimer);stop();show('LiveChat could not connect','The sign-in service could not load. Check your connection or ask the network administrator. ('+(e.code||'LC-AUTH-SDK')+')',{retry:true,signin:true});}})();
